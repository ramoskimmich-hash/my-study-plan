<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Schedule</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f9;
    }

    header {
        background: #4a6cf7;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 24px;
    }

    #calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
        padding: 20px;
    }

    .day {
        background: white;
        border-radius: 8px;
        padding: 10px;
        min-height: 100px;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        position: relative;
    }

    .day:hover {
        background: #e8edff;
    }

    .date {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .task {
        font-size: 12px;
        color: #333;
        margin-top: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
    }

    #modalContent {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 300px;
    }

    textarea {
        width: 100%;
        height: 100px;
    }

    button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        background: #4a6cf7;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #3a56d4;
    }
</style>
</head>
<body>

<header>📅 Study Schedule (Apr 12 – Oct 20)</header>

<div id="calendar"></div>

<div id="modal">
    <div id="modalContent">
        <h3 id="modalDate"></h3>
        <textarea id="taskInput" placeholder="Enter study tasks..."></textarea>
        <button onclick="saveTask()">Save</button>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const startDate = new Date('2026-04-12');
const endDate = new Date('2026-10-20');
const calendar = document.getElementById('calendar');

let selectedDate = null;

// Load saved tasks
let tasks = JSON.parse(localStorage.getItem('studyTasks')) || {};

function generateCalendar() {
    let current = new Date(startDate);

    while (current <= endDate) {
        const dateStr = current.toISOString().split('T')[0];

        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.onclick = () => openModal(dateStr);

        const dateLabel = document.createElement('div');
        dateLabel.className = 'date';
        dateLabel.textContent = current.toDateString();

        dayDiv.appendChild(dateLabel);

        if (tasks[dateStr]) {
            const taskPreview = document.createElement('div');
            taskPreview.className = 'task';
            taskPreview.textContent = tasks[dateStr];
            dayDiv.appendChild(taskPreview);
        }

        calendar.appendChild(dayDiv);

        current.setDate(current.getDate() + 1);
    }
}

function openModal(dateStr) {
    selectedDate = dateStr;
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('modalDate').textContent = dateStr;
    document.getElementById('taskInput').value = tasks[dateStr] || '';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function saveTask() {
    const text = document.getElementById('taskInput').value;
    tasks[selectedDate] = text;
    localStorage.setItem('studyTasks', JSON.stringify(tasks));
    location.reload();
}

generateCalendar();
</script>

</body>
</html>
