<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Planner Pro Grid</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #eef2f7;
}

header {
    background: #1f2a44;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

/* ================= CALENDAR ================= */
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 10px;
}

.day-box {
    background: white;
    min-height: 80px;
    border-radius: 8px;
    padding: 5px;
    cursor: pointer;
    position: relative;
    font-size: 12px;
}

.day-box:hover {
    background: #dfe8ff;
}

.day-number {
    font-weight: bold;
}

.progress-bar {
    height: 6px;
    background: #ddd;
    border-radius: 5px;
    margin-top: 5px;
}

.progress-fill {
    height: 6px;
    background: #2d6cdf;
    border-radius: 5px;
}

/* ================= PANEL ================= */
.panel {
    margin-top: 15px;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

button {
    padding: 5px 10px;
    cursor: pointer;
    background: #2d6cdf;
    color: white;
    border: none;
    border-radius: 5px;
}

button:hover {
    background: #1f56b3;
}

input {
    padding: 5px;
}

.small {
    font-size: 12px;
    color: gray;
}
</style>
</head>

<body>

<header>
    <h2>Advanced Study Planner Pro (Monthly Grid + Progress Tracker)</h2>
</header>

<div class="container">

<!-- ================= INPUT ================= -->
<div class="panel">
    <h3>Set Month</h3>
    <input type="month" id="month">
    <button onclick="generateMonth()">Generate Month</button>
</div>

<!-- ================= PROGRESS ================= -->
<div class="panel">
    <h3>Overall Progress</h3>
    <div class="progress-bar">
        <div id="overallProgress" class="progress-fill" style="width:0%"></div>
    </div>
    <div class="small" id="progressText">0%</div>
</div>

<!-- ================= CALENDAR ================= -->
<div class="panel">
    <h3>Calendar</h3>
    <div class="calendar" id="calendar"></div>
</div>

<!-- ================= TIMETABLE ================= -->
<div class="panel">
    <h3 id="selectedDayTitle">Select a Day</h3>

    <table>
        <thead>
            <tr>
                <th>Start</th>
                <th>End</th>
                <th>Subject</th>
                <th>Note</th>
                <th>Done</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="timetable"></tbody>
    </table>

    <br>

    <input type="time" id="startTime">
    <input type="time" id="endTime">
    <input type="text" id="subject" placeholder="Subject">
    <input type="text" id="note" placeholder="Note">
    <button onclick="addSlot()">Add Slot</button>
</div>

</div>

<script>

let selectedDay = null;
let currentMonthDays = [];

/* ================= MONTH GENERATION ================= */
function generateMonth() {
    let input = document.getElementById("month").value;
    if (!input) return alert("Select month");

    let [year, month] = input.split("-");
    month = parseInt(month);

    let date = new Date(year, month - 1, 1);
    currentMonthDays = [];

    while (date.getMonth() === month - 1) {
        currentMonthDays.push(new Date(date));
        date.setDate(date.getDate() + 1);
    }

    renderCalendar();
    updateProgress();
}

/* ================= CALENDAR RENDER ================= */
function renderCalendar() {
    let cal = document.getElementById("calendar");
    cal.innerHTML = "";

    currentMonthDays.forEach(day => {
        let key = day.toDateString();

        let tasks = getTasks(key);
        let done = tasks.filter(t => t.done).length;
        let total = tasks.length;
        let percent = total ? (done / total) * 100 : 0;

        let box = document.createElement("div");
        box.className = "day-box";

        box.innerHTML = `
            <div class="day-number">${day.getDate()}</div>
            <div class="small">${done}/${total}</div>
            <div class="progress-bar">
                <div class="progress-fill" style="width:${percent}%"></div>
            </div>
        `;

        box.onclick = () => selectDay(key);

        cal.appendChild(box);
    });
}

/* ================= SELECT DAY ================= */
function selectDay(day) {
    selectedDay = day;
    document.getElementById("selectedDayTitle").innerText = day;
    renderTable();
}

/* ================= STORAGE ================= */
function getTasks(day) {
    return JSON.parse(localStorage.getItem(day)) || [];
}

function saveTasks(day, tasks) {
    localStorage.setItem(day, JSON.stringify(tasks));
}

/* ================= ADD SLOT ================= */
function addSlot() {
    if (!selectedDay) return alert("Select a day first");

    let start = document.getElementById("startTime").value;
    let end = document.getElementById("endTime").value;
    let subject = document.getElementById("subject").value;
    let note = document.getElementById("note").value;

    if (!start || !end || !subject) return alert("Fill fields");

    let tasks = getTasks(selectedDay);

    tasks.push({
        start,
        end,
        subject,
        note,
        done: false
    });

    saveTasks(selectedDay, tasks);
    renderTable();
    renderCalendar();
    updateProgress();
}

/* ================= TABLE ================= */
function renderTable() {
    if (!selectedDay) return;

    let tbody = document.getElementById("timetable");
    tbody.innerHTML = "";

    let tasks = getTasks(selectedDay);

    tasks.sort((a,b) => a.start.localeCompare(b.start));

    tasks.forEach((t, i) => {
        tbody.innerHTML += `
        <tr>
            <td>${t.start}</td>
            <td>${t.end}</td>
            <td>${t.subject}</td>
            <td>${t.note || ""}</td>
            <td>
                <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggle(${i})">
            </td>
            <td>
                <button onclick="remove(${i})">X</button>
            </td>
        </tr>
        `;
    });
}

/* ================= ACTIONS ================= */
function toggle(i) {
    let tasks = getTasks(selectedDay);
    tasks[i].done = !tasks[i].done;
    saveTasks(selectedDay, tasks);
    renderTable();
    renderCalendar();
    updateProgress();
}

function remove(i) {
    let tasks = getTasks(selectedDay);
    tasks.splice(i,1);
    saveTasks(selectedDay, tasks);
    renderTable();
    renderCalendar();
    updateProgress();
}

/* ================= PROGRESS ================= */
function updateProgress() {
    let all = 0;
    let done = 0;

    currentMonthDays.forEach(d => {
        let tasks = getTasks(d.toDateString());
        all += tasks.length;
        done += tasks.filter(t => t.done).length;
    });

    let percent = all ? (done/all)*100 : 0;

    document.getElementById("overallProgress").style.width = percent + "%";
    document.getElementById("progressText").innerText = percent.toFixed(1) + "% completed";
}

</script>

</body>
</html>
