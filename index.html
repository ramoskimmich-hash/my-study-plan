<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study Planner ELITE v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#3a0ca3,#4361ee);
    color:white;
}
header{
    position:sticky;
    top:0;
    backdrop-filter:blur(12px);
    background:rgba(0,0,0,0.2);
    padding:15px;
    text-align:center;
    font-weight:bold;
}
.card{
    margin:10px;
    padding:15px;
    border-radius:14px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.12);
}
input,button{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:none;
    border-radius:8px;
}
input{
    background:rgba(255,255,255,0.2);
    color:white;
}
button{
    background:white;
    color:#3a0ca3;
    font-weight:bold;
    cursor:pointer;
}
#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    padding:10px;
}
.day{
    background:rgba(255,255,255,0.15);
    border-radius:10px;
    padding:8px;
    min-height:110px;
    cursor:pointer;
}
.task{
    margin-top:5px;
    padding:4px;
    border-radius:6px;
    font-size:11px;
    background:rgba(255,255,255,0.3);
}
.done{
    text-decoration:line-through;
    opacity:0.5;
}
#stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
}
.big{
    font-size:18px;
    font-weight:bold;
}
#timerDisplay{
    font-size:30px;
    text-align:center;
}
.small{
    font-size:12px;
    opacity:0.8;
}
</style>

</head>

<body>

<header>🚀 AI Study Planner ELITE v3</header>

<div class="card">
<input id="subjects" placeholder="Subjects (Math,Science,English)">
<input id="weak" placeholder="Weak subject (optional)">
<input type="number" id="hours" value="4">

<button onclick="generatePlan()">Generate Plan</button> <button onclick="exportData()">Export</button> <button onclick="importData()">Import</button> <button onclick="clearData()">Reset</button>

</div>

<div class="card" id="stats"></div>

<div class="card">
<div id="timerDisplay">25:00</div>
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause / Resume</button>
<button onclick="resetTimer()">Reset</button>
<div class="small">Focus ↔ Break auto cycle</div>
</div>

<div id="calendar"></div>

<script>
const start=new Date('2026-04-12');
const end=new Date('2026-10-20');

let data=JSON.parse(localStorage.getItem('eliteData'))||{};

/* TIMER STATE */
let timer=null;
let mode="focus";
let timeLeft=1500;
let isPaused=false;

/* PLAN */
function generatePlan(){
const subjects=document.getElementById('subjects').value.split(",");
const weak=document.getElementById('weak').value.trim();
const hours=parseInt(document.getElementById('hours').value);

if(!subjects[0]) return alert("Enter subjects");

let weights={};
subjects.forEach(s=>{
s=s.trim();
weights[s]=(s===weak)?3:1;
});

let d=new Date(start);

while(d<=end){
const key=d.toISOString().split('T')[0];
if(!data[key]) data[key]=[];

let totalWeight=Object.values(weights).reduce((a,b)=>a+b,0);

subjects.forEach(sub=>{
sub=sub.trim();
let portion=Math.round((weights[sub]/totalWeight)*hours);

for(let i=0;i<portion;i++){
data[key].push({text:sub+" (25m)",done:false});
}
});

data[key].sort(()=>Math.random()-0.5);
d.setDate(d.getDate()+1);
}

save();
}

/* RENDER */
function render(){
const cal=document.getElementById('calendar');
cal.innerHTML="";

let total=0,done=0,current=0,best=0;

Object.keys(data).sort().forEach(date=>{
let allDone=true;

data[date].forEach(t=>{
total++;
if(t.done) done++;
else allDone=false;
});

if(allDone&&data[date].length>0){
current++;
best=Math.max(best,current);
}else current=0;
});

document.getElementById('stats').innerHTML=`
<div><div class="big">${Math.round(done/total*100)||0}%</div>Progress</div>
<div><div class="big">${current}</div>Streak</div>
<div><div class="big">${best}</div>Best</div>
`;

let d=new Date(start);

while(d<=end){
const key=d.toISOString().split('T')[0];
const div=document.createElement('div');
div.className="day";
div.innerHTML=`<b>${d.getDate()}</b>`;

div.onclick=()=>{
let subject=prompt("Add task:");
if(subject){
if(!data[key]) data[key]=[];
data[key].push({text:subject,done:false});
save();
}
};

(data[key]||[]).slice(0,5).forEach((t,i)=>{
let task=document.createElement('div');
task.className="task "+(t.done?"done":"");
task.innerText=t.text;

task.onclick=(e)=>{
e.stopPropagation();
t.done=!t.done;
save();
};

task.ondblclick=(e)=>{
e.stopPropagation();
let edit=prompt("Edit:",t.text);
if(edit!==null){
t.text=edit;
save();
}
};

task.oncontextmenu=(e)=>{
e.preventDefault();
if(confirm("Delete?")){
data[key].splice(i,1);
save();
}
};

div.appendChild(task);
});

cal.appendChild(div);
d.setDate(d.getDate()+1);
}
}

function save(){
localStorage.setItem('eliteData',JSON.stringify(data));
render();
}

/* TIMER */
function startTimer(){
if(timer) return;

isPaused=false;

timer=setInterval(()=>{
if(isPaused) return;

timeLeft--;
updateTimer();

if(timeLeft<=0){
clearInterval(timer);
timer=null;

if(mode==="focus"){
mode="break";
timeLeft=300;
alert("Break time");
}else{
mode="focus";
timeLeft=1500;
alert("Back to work");
}

updateTimer();
}
},1000);
}

function pauseTimer(){
if(!timer) return;
isPaused=!isPaused;
}

function resetTimer(){
clearInterval(timer);
timer=null;
mode="focus";
timeLeft=1500;
isPaused=false;
updateTimer();
}

function updateTimer(){
let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

let status = isPaused ? "paused" : mode;

document.getElementById("timerDisplay").innerText=
`${min}:${sec.toString().padStart(2,'0')} (${status})`;
}

/* DATA */
function exportData(){
const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="study-data.json";
a.click();
}

function importData(){
const input=document.createElement("input");
input.type="file";

input.onchange=e=>{
const file=e.target.files[0];
const reader=new FileReader();

reader.onload=()=>{
data=JSON.parse(reader.result);
save();
};

reader.readAsText(file);
};

input.click();
}

function clearData(){
if(confirm("Reset everything?")){
localStorage.clear();
data={};
render();
}
}

updateTimer();
render();
</script>

</body>
</html>
