<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study Planner Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; margin:0; background:#f4f6fb; }
.dark { background:#121212; color:#eee; }

header {
    background:#4a6cf7;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

#controls, #stats {
    padding:10px;
    margin:10px;
    background:white;
    border-radius:8px;
}

.dark #controls, .dark #stats { background:#1e1e1e; }

input, button {
    width:100%;
    margin-top:6px;
    padding:8px;
}

button {
    background:#4a6cf7;
    color:white;
    border:none;
    cursor:pointer;
}

#calendar {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    padding:10px;
}

.day {
    background:white;
    padding:6px;
    border-radius:6px;
    min-height:90px;
    font-size:11px;
}

.dark .day { background:#1e1e1e; }

.task { cursor:pointer; }
.done { text-decoration:line-through; opacity:0.5; }
</style>
</head>

<body>

<header>🚀 AI Study Planner ELITE</header>

<div id="controls">
    <input id="subjects" placeholder="Subjects (Math,Science,English)">
    <input id="weak" placeholder="Weak subject (optional)">
    <input type="number" id="hours" value="4">
    
    <button onclick="generatePlan()">🧠 Generate AI Plan</button>
    <button onclick="toggleDark()">🌙 Dark Mode</button>
    <button onclick="clearData()">🗑 Reset</button>
</div>

<div id="stats"></div>
<div id="calendar"></div>

<script>
const start = new Date('2026-04-12');
const end = new Date('2026-10-20');

let data = JSON.parse(localStorage.getItem('eliteData')) || {};

function generatePlan(){
    const subjects = document.getElementById('subjects').value.split(",");
    const weak = document.getElementById('weak').value.trim();
    const hours = parseInt(document.getElementById('hours').value);

    if(!subjects[0]) return alert("Enter subjects");

    let weights = {};
    subjects.forEach(s=>{
        s=s.trim();
        weights[s] = (s===weak)?2:1;
    });

    let d = new Date(start);

    while(d<=end){
        const key = d.toISOString().split('T')[0];
        data[key]=[];

        let totalWeight = Object.values(weights).reduce((a,b)=>a+b,0);

        subjects.forEach(sub=>{
            sub=sub.trim();
            let portion = Math.round((weights[sub]/totalWeight)*hours);

            for(let i=0;i<portion;i++){
                data[key].push({
                    text: sub,
                    done:false
                });
            }
        });

        // Shuffle tasks
        data[key].sort(()=>Math.random()-0.5);

        d.setDate(d.getDate()+1);
    }

    save();
}

function render(){
    const cal = document.getElementById('calendar');
    cal.innerHTML="";

    let weakMap = {};
    let total=0, done=0, streak=0;

    let dates = Object.keys(data).sort();

    dates.forEach(date=>{
        let allDone = true;

        data[date].forEach(t=>{
            total++;
            if(t.done) done++;
            else {
                allDone=false;
                weakMap[t.text]=(weakMap[t.text]||0)+1;
            }
        });

        if(allDone && data[date].length>0) streak++;
        else streak=0;
    });

    let weakest = Object.entries(weakMap)
        .sort((a,b)=>b[1]-a[1])[0];

    document.getElementById('stats').innerHTML = `
        ✅ Progress: ${done}/${total} (${Math.round(done/total*100)||0}%)<br>
        🔥 Streak: ${streak} days<br>
        ⚠️ Weakest Subject: ${weakest?weakest[0]:"None"}
    `;

    let d = new Date(start);

    while(d<=end){
        const key = d.toISOString().split('T')[0];

        const div = document.createElement('div');
        div.className="day";

        div.innerHTML = `<b>${d.getDate()}</b>`;

        (data[key]||[]).slice(0,4).forEach((t,i)=>{
            div.innerHTML += `
            <div class="task ${t.done?'done':''}" 
            onclick="toggle('${key}',${i})">
            ${t.text}
            </div>`;
        });

        cal.appendChild(div);
        d.setDate(d.getDate()+1);
    }
}

function toggle(date,i){
    data[date][i].done=!data[date][i].done;

    // Adaptive AI: unfinished subjects get boosted
    if(!data[date][i].done){
        data[date][i].priority = (data[date][i].priority||1)+0.3;
    }

    save();
}

function save(){
    localStorage.setItem('eliteData',JSON.stringify(data));
    render();
}

function toggleDark(){
    document.body.classList.toggle('dark');
}

function clearData(){
    if(confirm("Reset everything?")){
        localStorage.clear();
        data={};
        render();
    }
}

// Reminder every hour
setInterval(()=>{
    if(Notification.permission==="granted"){
        new Notification("📚 Time to study!");
    }
},3600000);

if("Notification" in window){
    Notification.requestPermission();
}

render();
</script>

</body>
</html>
