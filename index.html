<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .day-card { min-height: 70px; transition: all 0.2s; border: 1px solid #e2e8f0; border-radius: 8px; }
        .studied { background-color: #dcfce7 !important; border-color: #22c55e !important; }
        .missed { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        /* Focus Mode Theme */
        body.focus-mode { background-color: #0f172a !important; color: white !important; }
        .focus-mode .bg-white { background-color: #1e293b !important; color: white !important; border-color: #334155 !important; }
        .focus-mode h1, .focus-mode h2 { color: #f8fafc !important; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 transition-colors duration-500">

    <div class="max-w-4xl mx-auto">
        <div id="timer-box" class="bg-white p-6 rounded-2xl shadow-lg mb-8 text-center border-2 border-slate-200">
            <h2 class="text-xl font-bold mb-4" id="timer-display">25:00</h2>
            <button onclick="startTimer()" id="start-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold">Start Focus Session</button>
        </div>

        <div class="grid md:grid-cols-2 gap-8 mb-10">
            <div id="stats-display" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <canvas id="progressChart" width="200" height="200"></canvas>
            </div>
        </div>

        <div id="calendar-container" class="space-y-10"></div>
    </div>

    <script>
        // --- Timer Logic ---
        let timeLeft = 25 * 60;
        let timerInterval;
        const timerDisplay = document.getElementById('timer-display');

        function startTimer() {
            document.body.classList.add('focus-mode');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                timerDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.body.classList.remove('focus-mode');
                    alert("Focus session complete!");
                }
            }, 1000);
        }

        // --- Chart Logic ---
        let myChart;
        function updateChart(done, missed) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Learnt', 'Missed'],
                    datasets: [{
                        data: [done, missed],
                        backgroundColor: ['#22c55e', '#ef4444']
                    }]
                }
            });
        }

        // ... (Include your existing initCalendar and updateDay logic here)
        
        function updateStats() {
            const total = Object.keys(studyData).length;
            const done = Object.values(studyData).filter(v => v === 'done').length;
            const missed = Object.values(studyData).filter(v => v === 'missed').length;
            
            document.getElementById('stats-display').innerHTML = `
                <p class="text-sm text-slate-400 font-bold uppercase">Progress Overview</p>
                <p class="text-3xl font-black">${done} / ${done + missed} Completed</p>
            `;
            updateChart(done, missed);
        }
        
        initCalendar();
    </script>
</body>
</html>
