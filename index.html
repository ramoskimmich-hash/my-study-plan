<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study Planner Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4a6cf7, #6c5ce7);
    color:white;
}

header {
    position:sticky;
    top:0;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.card {
    margin:10px;
    padding:15px;
    border-radius:12px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
}

input, button {
    width:100%;
    margin-top:8px;
    padding:10px;
    border:none;
    border-radius:8px;
}

input {
    background: rgba(255,255,255,0.2);
    color:white;
}

button {
    background:white;
    color:#4a6cf7;
    font-weight:bold;
    cursor:pointer;
}

#calendar {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    padding:10px;
}

.day {
    background: rgba(255,255,255,0.15);
    border-radius:10px;
    padding:8px;
    min-height:100px;
    cursor:pointer;
}

.task {
    margin-top:5px;
    padding:4px;
    border-radius:6px;
    font-size:11px;
    background: rgba(255,255,255,0.25);
}

.done {
    text-decoration: line-through;
    opacity:0.6;
}

#stats {
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.big {
    font-size:18px;
    font-weight:bold;
}

#timerDisplay {
    font-size:30px;
    text-align:center;
}
</style>
</head>

<body>

<header>🚀 AI Study Planner ELITE</header>

<div class="card">
    <input id="subjects" placeholder="Subjects (Math,Science,English)">
    <input id="weak" placeholder="Weak subject (optional)">
    <input type="number" id="hours" value="4">

    <button onclick="generatePlan()">🧠 Generate AI Plan</button>
    <button onclick="clearData()">🗑 Reset</button>
</div>

<div class="card" id="stats"></div>

<div class="card">
    <div id="timerDisplay">25:00</div>
    <button onclick="startTimer()">▶ Start</button>
    <button onclick="resetTimer()">⏹ Reset</button>
</div>

<div id="calendar"></div>

<script>
const start = new Date('2026-04-12');
const end = new Date('2026-10-20');

let data = JSON.parse(localStorage.getItem('eliteData')) || {};

function generatePlan(){
    const subjects = document.getElementById('subjects').value.split(",");
    const weak = document.getElementById('weak').value.trim();
    const hours = parseInt(document.getElementById('hours').value);

    if(!subjects[0]) return alert("Enter subjects");

    let weights = {};
    subjects.forEach(s=>{
        s=s.trim();
        weights[s] = (s===weak)?2:1;
    });

    let d = new Date(start);

    while(d<=end){
        const key = d.toISOString().split('T')[0];

        if(!data[key]) data[key]=[];

        let totalWeight = Object.values(weights).reduce((a,b)=>a+b,0);

        subjects.forEach(sub=>{
            sub=sub.trim();
            let portion = Math.round((weights[sub]/totalWeight)*hours);

            for(let i=0;i<portion;i++){
                data[key].push({
                    text: sub,
                    done:false
                });
            }
        });

        d.setDate(d.getDate()+1);
    }

    save();
}

function render(){
    const cal = document.getElementById('calendar');
    cal.innerHTML="";

    let total=0, done=0, streak=0;

    let dates = Object.keys(data).sort();

    dates.forEach(date=>{
        let allDone = true;

        data[date].forEach(t=>{
            total++;
            if(t.done) done++;
            else allDone=false;
        });

        if(allDone && data[date].length>0) streak++;
        else streak=0;
    });

    document.getElementById('stats').innerHTML = `
        <div>
            <div class="big">${Math.round(done/total*100)||0}%</div>
            Progress
        </div>
        <div>
            <div class="big">${streak}</div>
            Streak 🔥
        </div>
    `;

    let d = new Date(start);

    while(d<=end){
        const key = d.toISOString().split('T')[0];

        const div = document.createElement('div');
        div.className="day";

        div.innerHTML = `<b>${d.getDate()}</b>`;

        div.onclick = () => {
            let subject = prompt("Add subject:");
            if(subject){
                if(!data[key]) data[key]=[];
                data[key].push({ text: subject, done:false });
                save();
            }
        };

        (data[key]||[]).slice(0,4).forEach((t,i)=>{
            let task = document.createElement('div');
            task.className = "task " + (t.done?"done":"");
            task.innerText = t.text;

            task.onclick = (e)=>{
                e.stopPropagation();
                t.done=!t.done;
                save();
            };

            div.appendChild(task);
        });

        cal.appendChild(div);
        d.setDate(d.getDate()+1);
    }
}

function save(){
    localStorage.setItem('eliteData',JSON.stringify(data));
    render();
}

function clearData(){
    if(confirm("Reset everything?")){
        localStorage.clear();
        data={};
        render();
    }
}

/* TIMER */
let timer;
let timeLeft = 1500;

function updateTimer(){
    let min = Math.floor(timeLeft/60);
    let sec = timeLeft%60;
    document.getElementById("timerDisplay").innerText =
        `${min}:${sec.toString().padStart(2,'0')}`;
}

function startTimer(){
    if(timer) return;

    timer = setInterval(()=>{
        timeLeft--;
        updateTimer();

        if(timeLeft<=0){
            clearInterval(timer);
            timer=null;
            alert("Break time!");
        }
    },1000);
}

function resetTimer(){
    clearInterval(timer);
    timer=null;
    timeLeft=1500;
    updateTimer();
}

updateTimer();
render();
</script>

</body>
</html>
